
name: DebugApp

options:
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  DebugApp:
    type: application
    platform: iOS
    sources:
      - path: app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.DebugToolkit
        GENERATE_INFOPLIST_FILE: true
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic

schemes:
  DebugApp:
    build:
      targets:
        DebugApp: all
    run:
      config: Debug
    archive:
      config: Release
